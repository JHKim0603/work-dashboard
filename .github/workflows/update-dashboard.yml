name: Update Work Dashboard

on:
  schedule:
    # Cron is UTC and KST is UTC+9, so these land at 08:23 and 11:23 KST the next morning.
    #
    # The day range deliberately differs from stockdashboard's Mon-Fri. That repo skips the
    # weekend because no trading happened, but weather, holidays and typhoons do not stop on
    # Sunday: under Mon-Fri UTC, Monday morning - a working day - would have opened on
    # Saturday's page. Every day costs two extra runs a week and keeps the page never more
    # than a morning old.
    #
    # Four slots, none on the hour or half hour: 08:23, 09:47, 11:23 and 13:41 KST.
    #
    # GitHub drops scheduled runs under load and documents those peaks as the thing to avoid.
    # This workflow sat on ':00', then ':30', and fired zero times in three days; every run it
    # has ever had was manual. stockdashboard's ':30' does fire, but has drifted 15 minutes,
    # then 5 hours, then 7 - the same overloaded queue seen from the other side.
    #
    # So delivery does not depend on any single slot surviving. Each is an independent attempt
    # and the first one to get through sends; the rest find the marker already set for today
    # and only refresh the page. Public repos get unlimited Actions minutes, so the extra runs
    # cost nothing, and a page refreshed four times a morning is not a downside.
    - cron: '23 23 * * *'
    - cron: '47 0 * * *'
    - cron: '23 2 * * *'
    - cron: '41 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Generate dashboard.html
        shell: pwsh
        env:
          # Optional: unset simply skips the 국내 경유/휘발유 card, everything else still runs.
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          # Also optional: unset simply skips whatever 관세청 수입단가 cards customsSeries lists.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: ./Update-WorkDashboard.ps1

      - name: Read email subject
        id: subject
        run: echo "text=$(cat email-subject.txt)" >> "$GITHUB_OUTPUT"

      # Several slots fire each morning because any one of them can be dropped, so on a normal
      # day more than one survives and the inbox would get the same digest repeatedly.
      #
      # The gate reads .last-digest, a committed marker holding the KST date of the last
      # delivery that actually left the SMTP server. Deriving this from run history instead
      # would be wrong in the case that matters most: the mail step is continue-on-error, so a
      # run whose send failed still reports success, and every later slot would then treat the
      # day as delivered and stay silent. Recording only after a confirmed send means a failed
      # send leaves the marker stale and the next slot retries.
      - name: Check whether today's digest already went out
        id: mailgate
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "manual run - sending regardless of marker"
            exit 0
          fi
          last=$(cat .last-digest 2>/dev/null | tr -d '[:space:]')
          if [[ "$last" == "$today" ]]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "already delivered for $today KST - skipping mail"
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "last delivery was '${last:-never}', today is $today KST - sending"
          fi

      # Non-blocking: the published dashboard is the primary output, so a mail failure
      # (missing/expired Gmail secret, SMTP outage) must not stop the Pages deploy below.
      - name: Send email summary
        id: mail
        if: steps.mailgate.outputs.send == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.subject.outputs.text }}
          to: jhyupkim@unid.co.kr
          from: 업무 참고자료 Dashboard <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://email-summary.html

      - name: Mark today as delivered
        if: steps.mail.outcome == 'success'
        run: echo "${{ steps.mailgate.outputs.today }}" > .last-digest

      # Both the accumulated series and the delivery marker go back in one commit, after the
      # mail rather than before it. Opinet serves 7 days and SSE's SCFI history is
      # subscriber-only, so keeping what each run saw is the only way those become long series.
      #
      # Non-blocking, and it rebases before pushing: a commit landing on main mid-run rejects
      # a plain push, and while this step was fatal that took the mail and the Pages deploy
      # with it - the two things the run exists to produce. Losing a day of accumulation costs
      # nothing by comparison, and nothing at all in practice, since the store is keyed by date
      # and both upstreams still serve the recent window for the next run to re-merge.
      #
      # If the marker's push is the part that loses the race, the day's mail has already gone
      # out and a later slot will send a second copy. One duplicate beats a silent miss, which
      # is the failure this whole ladder exists to prevent.
      - name: Commit history and delivery marker
        continue-on-error: true
        run: |
          if [[ -n "$(git status --porcelain data-history.json .last-digest)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data-history.json .last-digest
            git commit -m "chore: accumulate price history $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "nothing to commit"
          fi

      - name: Prepare Pages content
        run: cp dashboard.html index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
