name: Update Work Dashboard

on:
  schedule:
    # Cron is UTC and KST is UTC+9, so these land at 08:23 and 11:23 KST the next morning.
    #
    # The day range deliberately differs from stockdashboard's Mon-Fri. That repo skips the
    # weekend because no trading happened, but weather, holidays and typhoons do not stop on
    # Sunday: under Mon-Fri UTC, Monday morning - a working day - would have opened on
    # Saturday's page. Every day costs two extra runs a week and keeps the page never more
    # than a morning old.
    #
    # Two slots, and neither on the hour or half hour. GitHub drops scheduled runs under load
    # and explicitly advises avoiding those peaks: this workflow sat on ':00' then ':30' and
    # fired zero times in three days, while stockdashboard's ':30' slot did fire but drifted
    # 15 minutes, then 5 hours, then 7. The second slot is a catch-up - if the first was
    # dropped the digest still arrives before lunch. "Send email summary" is gated on whether
    # a scheduled run already succeeded today (KST), so the catch-up never double-sends.
    - cron: '23 23 * * *'
    - cron: '23 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  # for the mail gate below to read this workflow's own earlier runs. Naming any permission
  # drops the defaults for the rest, so it has to be listed explicitly.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Generate dashboard.html
        shell: pwsh
        env:
          # Optional: unset simply skips the 국내 경유/휘발유 card, everything else still runs.
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          # Also optional: unset simply skips whatever 관세청 수입단가 cards customsSeries lists.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: ./Update-WorkDashboard.ps1

      # Opinet serves 7 days and SSE's SCFI history is subscriber-only, so the only way these
      # become long series is to keep what each run saw. Committing the store back is what
      # makes that accumulation survive to the next run.
      # Non-blocking, and it rebases before pushing. A plain push here races anything that lands
      # on main while the run is in flight: a commit pushed mid-run makes this step's push
      # rejected, and because the step was fatal that took the mail and the Pages deploy down
      # with it - the two things the run actually exists to produce. Losing a day of accumulation
      # costs nothing by comparison, and costs nothing at all in practice: the store is keyed by
      # date and both upstreams still serve the recent window, so the next run re-merges it.
      - name: Commit accumulated history
        continue-on-error: true
        run: |
          if [[ -n "$(git status --porcelain data-history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data-history.json
            git commit -m "chore: accumulate price history $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "no history change"
          fi

      - name: Read email subject
        id: subject
        run: echo "text=$(cat email-subject.txt)" >> "$GITHUB_OUTPUT"

      # The catch-up slot exists because the first one gets dropped; on the days it is not
      # dropped both slots run, and without this the inbox gets the same digest twice. A
      # manual dispatch always sends - that is someone explicitly asking for it.
      - name: Check whether today's digest already went out
        id: mailgate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "manual run - sending"
            exit 0
          fi
          today=$(TZ=Asia/Seoul date +%F)
          sent=0
          while read -r ts; do
            [[ -z "$ts" ]] && continue
            [[ "$(TZ=Asia/Seoul date -d "$ts" +%F)" == "$today" ]] && sent=1
          done < <(gh run list --repo "$GITHUB_REPOSITORY" \
                     --workflow "${{ github.workflow }}" --event schedule --status success \
                     --limit 20 --json databaseId,createdAt \
                     -q ".[] | select(.databaseId != ${{ github.run_id }}) | .createdAt")
          if [[ "$sent" -eq 1 ]]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "a scheduled run already succeeded on $today KST - skipping mail"
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "no successful scheduled run yet on $today KST - sending"
          fi

      # Non-blocking: the published dashboard is the primary output, so a mail failure
      # (missing/expired Gmail secret, SMTP outage) must not stop the Pages deploy below.
      - name: Send email summary
        if: steps.mailgate.outputs.send == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.subject.outputs.text }}
          to: jhyupkim@unid.co.kr
          from: 업무 참고자료 Dashboard <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://email-summary.html

      - name: Prepare Pages content
        run: cp dashboard.html index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
