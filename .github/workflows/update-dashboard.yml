name: Update Work Dashboard

on:
  schedule:
    # 08:30 KST, matching the stockdashboard repo so both digests land in the inbox together.
    # Cron is UTC and KST is UTC+9, so this UTC Mon-Fri window arrives as KST Tue-Sat 08:30.
    #
    # Note what that costs here: stockdashboard skips KST Sun/Mon because no trading happened
    # over the weekend, but this dashboard carries weather, holidays and typhoons, which do not
    # stop on Sunday - so Monday morning now opens with Saturday's page. To send Mon-Fri KST
    # instead, use '30 23 * * 0-4'; for every day, '30 23 * * *'.
    - cron: '30 23 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Generate dashboard.html
        shell: pwsh
        env:
          # Optional: unset simply skips the 국내 경유/휘발유 card, everything else still runs.
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          # Also optional: unset simply skips whatever 관세청 수입단가 cards customsSeries lists.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: ./Update-WorkDashboard.ps1

      # Opinet serves 7 days and SSE's SCFI history is subscriber-only, so the only way these
      # become long series is to keep what each run saw. Committing the store back is what
      # makes that accumulation survive to the next run.
      - name: Commit accumulated history
        run: |
          if [[ -n "$(git status --porcelain data-history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data-history.json
            git commit -m "chore: accumulate price history $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no history change"
          fi

      - name: Read email subject
        id: subject
        run: echo "text=$(cat email-subject.txt)" >> "$GITHUB_OUTPUT"

      # Non-blocking: the published dashboard is the primary output, so a mail failure
      # (missing/expired Gmail secret, SMTP outage) must not stop the Pages deploy below.
      - name: Send email summary
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.subject.outputs.text }}
          to: jhyupkim@unid.co.kr
          from: 업무 참고자료 Dashboard <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://email-summary.html

      - name: Prepare Pages content
        run: cp dashboard.html index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
