<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 참고자료 Dashboard</title>
<style>
  .viz-root {
    color-scheme: light;
    --page:            #f9f9f7;
    --surface:         #fcfcfb;
    --surface-raised:  #ffffff;
    --ink-primary:     #0b0b0b;
    --ink-secondary:   #52514e;
    --ink-muted:       #6e6c66;
    --gridline:        #e1e0d9;
    --border:          rgba(11,11,11,0.10);
    --accent:          #2a78d6;
    --accent-wash:     rgba(42,120,214,0.08);
    --good:            #006300;
    --bad:             #b3221f;
  }
  @media (prefers-color-scheme: dark) {
    .viz-root {
      color-scheme: dark;
      --page:            #0d0d0d;
      --surface:         #1a1a19;
      --surface-raised:  #212120;
      --ink-primary:     #ffffff;
      --ink-secondary:   #c3c2b7;
      --ink-muted:       #a3a199;
      --gridline:        #2c2c2a;
      --border:          rgba(255,255,255,0.10);
      --accent:          #3987e5;
      --accent-wash:     rgba(57,135,229,0.14);
      --good:            #0ca30c;
      --bad:             #e66767;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-raised: #212120;
    --ink-primary: #ffffff; --ink-secondary: #c3c2b7; --ink-muted: #a3a199;
    --gridline: #2c2c2a; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,0.14);
    --good: #0ca30c; --bad: #e66767;
  }
  :root[data-theme="light"] .viz-root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --surface-raised: #ffffff;
    --ink-primary: #0b0b0b; --ink-secondary: #52514e; --ink-muted: #6e6c66;
    --gridline: #e1e0d9; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.08);
    --good: #006300; --bad: #b3221f;
  }

  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--page);
    color: var(--ink-primary);
    min-height: 100vh;
    box-sizing: border-box;
    padding: 32px clamp(16px, 4vw, 48px) 56px;
  }
  .viz-root *, .viz-root *::before, .viz-root *::after { box-sizing: border-box; }

  .topbar {
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; max-width: 1320px; margin: 0 auto 28px;
  }
  .topbar h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .topbar .sub { font-size: 13px; color: var(--ink-muted); }

  .wrap { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

  /* 날씨 / 공휴일 / 태풍 sit side by side on wide screens, stack on narrow ones */
  .top-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start; }
  @media (max-width: 980px) {
    .top-row { grid-template-columns: 1fr; }
  }

  .section-title {
    font-size: 14px; font-weight: 650; color: var(--ink-secondary);
    margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.04em;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  /* weather cards hold a 7-day horizontal strip, which needs real width to stay legible -
     one wide card per location instead of a multi-column tile grid */
  #weatherGrid.grid { grid-template-columns: 1fr; }

  .card {
    background: var(--surface-raised); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px;
  }
  .card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 650; }
  .card .flag { font-size: 11px; color: var(--ink-muted); margin-bottom: 8px; }

  .weather-now { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .weather-now .temp { font-size: 30px; font-weight: 700; line-height: 1; }
  .weather-now .desc { font-size: 13px; color: var(--ink-secondary); }
  .weather-meta { font-size: 12px; color: var(--ink-muted); margin-bottom: 12px; }

  .week-strip {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;
    margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--gridline);
  }
  .week-day {
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
    cursor: default;
  }
  .week-day .wd-label { font-size: 10.5px; color: var(--ink-muted); font-weight: 600; white-space: nowrap; }
  .week-day .wd-label.today { color: var(--accent); }
  .week-day .wd-icon { font-size: 15px; line-height: 1; }
  .wd-bar-track {
    position: relative; width: 7px; height: 52px; background: var(--gridline); border-radius: 4px;
  }
  .wd-bar {
    position: absolute; left: 0; right: 0; border-radius: 4px;
    background: linear-gradient(180deg, var(--bad) 0%, var(--accent) 55%, #4a90d9 100%);
  }
  .week-day .wd-max { font-size: 11.5px; font-weight: 700; color: var(--ink-primary); }
  .week-day .wd-min { font-size: 10.5px; color: var(--ink-muted); }
  .week-day .wd-rain { font-size: 9.5px; color: var(--accent); white-space: nowrap; }
  .week-day .wd-adv { width: 13px; height: 13px; border-radius: 50%; font-size: 8.5px; line-height: 13px; }
  .week-day .wd-adv.warn { background: rgba(177,124,0,0.18); color: #a15c00; }
  .week-day .wd-adv.danger { background: var(--bad-wash, rgba(179,34,31,0.16)); color: var(--bad); }

  .advisory-badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px;
    margin-top: 6px; margin-right: 4px;
  }
  .advisory-badge.warn { background: rgba(177,124,0,0.12); color: #a15c00; }
  .advisory-badge.danger { background: var(--bad-wash, rgba(179,34,31,0.12)); color: var(--bad); }

  .typhoon-card {
    border-radius: 12px; padding: 16px 20px; border: 1px solid var(--border);
  }
  .typhoon-card.alert { background: rgba(179,34,31,0.08); border-color: rgba(179,34,31,0.25); }
  .typhoon-card.calm { background: var(--surface-raised); }
  .typhoon-card .headline { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .typhoon-card.alert .headline { color: var(--bad); }
  .typhoon-row { font-size: 12.5px; color: var(--ink-secondary); padding: 6px 0; border-top: 1px solid var(--gridline); line-height: 1.5; }
  .typhoon-row:first-of-type { border-top: none; }
  .typhoon-row b { color: var(--ink-primary); }
  .typhoon-row a { color: var(--accent); text-decoration: none; font-size: 11.5px; margin-left: 6px; }
  .typhoon-row.past { font-size: 12px; }
  .typhoon-row .ago {
    font-size: 10.5px; font-weight: 700; color: var(--ink-muted);
    background: var(--gridline); padding: 1px 6px; border-radius: 999px;
  }
  .past-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-muted);
    text-transform: uppercase; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--gridline);
  }
  .past-label + .typhoon-row { border-top: none; }

  .card.wide { grid-column: 1 / -1; }
  .price-now { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 2px 0 10px; }
  .price-now .pv { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .price-now .pu { font-size: 12px; color: var(--ink-muted); margin-left: -4px; }
  .price-now .pd { font-size: 11.5px; color: var(--ink-muted); }
  .price-now .chg { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .price-now .chg.up { color: var(--bad); }
  .price-now .chg.down { color: var(--good); }

  .price-chart { width: 100%; height: auto; display: block; overflow: visible; }
  .ch-grid { stroke: var(--gridline); stroke-width: 1; }
  .ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ch-area { fill: var(--accent-wash); stroke: none; }
  .ch-dot { fill: var(--accent); }
  .ch-ylabel { font-size: 9.5px; fill: var(--ink-muted); text-anchor: end; font-variant-numeric: tabular-nums; }
  .ch-xlabel { font-size: 9.5px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .chart-note { font-size: 11px; color: var(--ink-muted); margin-top: 6px; }
  .news-caveat { font-size: 10.5px; color: var(--ink-muted); margin-bottom: 8px; font-style: italic; }

  .holiday-card {
    background: var(--accent-wash); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px;
  }
  .holiday-card .headline { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .holiday-card .sub2 { font-size: 13px; color: var(--ink-secondary); margin-bottom: 10px; }
  .holiday-card .dday {
    display: inline-block; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px; margin-right: 8px;
  }
  .upcoming-list { margin-top: 12px; font-size: 12px; color: var(--ink-secondary); }
  .upcoming-list .up-row { display: flex; justify-content: space-between; padding: 4px 0; border-top: 1px solid var(--gridline); }
  .upcoming-list .up-row:first-child { border-top: none; }

  .news-item { font-size: 12.5px; padding: 7px 0; border-top: 1px solid var(--gridline); }
  .news-item:first-child { border-top: none; }
  .news-item a { color: var(--accent); text-decoration: none; }
  .news-item a:hover { text-decoration: underline; }
  .news-item .src { color: var(--ink-muted); font-size: 11px; margin-left: 4px; }
  .empty-note { font-size: 12px; color: var(--ink-muted); font-style: italic; }

  .footnote { max-width: 1320px; margin: 32px auto 0; font-size: 11.5px; color: var(--ink-muted); line-height: 1.7; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="topbar">
    <div>
      <h1>업무 참고자료 Dashboard</h1>
      <div class="sub" id="fetchedAtLabel"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="top-row">
      <div>
        <div class="section-title">날씨 / 온습도</div>
        <div id="weatherGrid"></div>
      </div>

      <div>
        <div class="section-title">공휴일 · 연휴</div>
        <div id="holidaySection"></div>
      </div>

      <div>
        <div class="section-title">베트남 태풍 감시 (하노이·호치민)</div>
        <div id="typhoonSection"></div>
      </div>
    </div>

    <div>
      <div class="section-title">원자재 가격 · 수급</div>
      <div class="grid" id="materialsGrid"></div>
    </div>
  </div>

  <div class="footnote">
    날씨 출처: Open-Meteo (폭염/한파 멘트는 기상청 특보 기준을 단순화한 참고용 임계값).
    공휴일 출처: Nager.Date. 태풍 정보 출처: GDACS(UN 재해 알림 시스템).
    KCl 가격 출처: World Bank Pink Sheet(월간, USD/mt).
    PP/PE·목재는 무료 공개 수치 API가 없어 관련 뉴스 헤드라인으로 대체했습니다(Google 뉴스 검색).
    모두 참고용으로만 사용하세요.
  </div>
</div>

<script>
const WEATHER = __WEATHER_JSON__;
const HOLIDAY = __HOLIDAY_JSON__;
const TYPHOON = __TYPHOON_JSON__;
const KCL = __KCL_JSON__;
const MATERIALS = __MATERIALS_JSON__;
const FETCHED_AT = "__FETCHED_AT__";

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("fetchedAtLabel").textContent = FETCHED_AT ? `업데이트: ${FETCHED_AT.replace("T", " ").slice(0, 16)}` : "";

function advisoryBadges(advisories) {
  if (!Array.isArray(advisories) || advisories.length === 0) return "";
  return advisories.map(a => `<span class="advisory-badge ${a.tone === "danger" ? "danger" : "warn"}">⚠ ${esc(a.text)}</span>`).join("");
}

// WMO weather code -> emoji, matching the Korean labels the generator already assigns
function weatherIcon(desc) {
  if (!desc) return "·";
  if (desc.includes("뇌우")) return "⛈️";
  if (desc.includes("우박")) return "🌨️";
  if (desc.includes("눈")) return "❄️";
  if (desc.includes("소나기")) return "🌦️";
  if (desc.includes("비") || desc.includes("이슬비")) return "🌧️";
  if (desc.includes("안개")) return "🌫️";
  if (desc.includes("흐림")) return "☁️";
  if (desc.includes("맑음")) return "☀️";
  return "·";
}

const DOW = ["일", "월", "화", "수", "목", "금", "토"];

const weatherGrid = document.getElementById("weatherGrid");
if (!WEATHER || WEATHER.length === 0) {
  weatherGrid.innerHTML = `<div class="empty-note">날씨 정보를 가져오지 못했습니다.</div>`;
} else {
  weatherGrid.innerHTML = WEATHER.map(w => {
    const days = w.days || [];
    // bars are scaled against this location's own week range, so the week's shape reads
    // clearly instead of being flattened by an absolute temperature scale
    const allTemps = days.flatMap(d => [d.minC, d.maxC]);
    const lo = Math.min(...allTemps), hi = Math.max(...allTemps);
    const span = (hi - lo) || 1;
    const todayStr = (days[0] && days[0].date) || "";

    const strip = days.map(d => {
      const dt = new Date(d.date + "T00:00:00");
      const label = `${dt.getMonth() + 1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
      const topPct = ((hi - d.maxC) / span) * 100;
      const botPct = ((d.minC - lo) / span) * 100;
      const adv = Array.isArray(d.advisories) && d.advisories.length ? d.advisories[0] : null;
      const advDot = adv
        ? `<span class="wd-adv ${adv.tone === "danger" ? "danger" : "warn"}" title="${esc(adv.text)}">!</span>`
        : `<span class="wd-adv"></span>`;
      return `
        <div class="week-day" title="${esc(d.date)} ${esc(d.desc)} ${d.minC}~${d.maxC}°C, 강수확률 ${d.chanceOfRain}%">
          <span class="wd-label${d.date === todayStr ? " today" : ""}">${esc(label)}</span>
          <span class="wd-icon">${weatherIcon(d.desc)}</span>
          <span class="wd-max">${d.maxC}°</span>
          <div class="wd-bar-track"><div class="wd-bar" style="top:${topPct.toFixed(1)}%;bottom:${botPct.toFixed(1)}%"></div></div>
          <span class="wd-min">${d.minC}°</span>
          <span class="wd-rain">💧${d.chanceOfRain}%</span>
          ${advDot}
        </div>`;
    }).join("");

    return `
      <div class="card">
        <h3>${esc(w.displayName)}</h3>
        <div class="weather-now">
          <span class="temp">${w.tempC}°C</span>
          <span class="desc">${esc(w.desc)} · 체감 ${w.feelsLikeC}°C</span>
        </div>
        <div class="weather-meta">습도 ${w.humidity}% ${advisoryBadges(w.advisories)}</div>
        <div class="week-strip">${strip}</div>
      </div>`;
  }).join("");
}

const holidaySection = document.getElementById("holidaySection");
if (!HOLIDAY) {
  holidaySection.innerHTML = `<div class="empty-note">공휴일 정보를 가져오지 못했습니다.</div>`;
} else {
  const dDayText = HOLIDAY.dDay === 0 ? "오늘부터" : `D-${HOLIDAY.dDay}`;
  const names = [...new Set(HOLIDAY.holidayNames || [])].join(", ");
  const upcoming = (HOLIDAY.nextHolidays || []).map(h =>
    `<div class="up-row"><span>${esc(h.name)}</span><span>${esc(h.date)}</span></div>`
  ).join("");
  holidaySection.innerHTML = `
    <div class="holiday-card">
      <span class="dday">${dDayText}</span>
      <span class="headline">가장 빠른 연휴: ${esc(HOLIDAY.startDate)} ~ ${esc(HOLIDAY.endDate)} (${HOLIDAY.days}일)</span>
      <div class="sub2">${esc(names)}</div>
      <div class="upcoming-list">${upcoming}</div>
    </div>`;
}

const typhoonSection = document.getElementById("typhoonSection");
if (!TYPHOON) {
  typhoonSection.innerHTML = `<div class="empty-note">태풍 정보를 가져오지 못했습니다.</div>`;
} else {
  const past = TYPHOON.past || [];
  const pastBlock = past.length
    ? `<div class="past-label">최근 발생 이력 · 다음 시기 가늠용</div>` +
      past.map(t => `
        <div class="typhoon-row past">
          <b>${esc(t.name)}</b> <span class="ago">${t.daysAgo}일 전</span><br>
          ${esc((t.toDate || "").slice(0, 10))} 소멸 · ${esc(t.nearestHub)} 인근 (${t.distanceKm}km)
          <a href="${esc(t.reportUrl)}" target="_blank" rel="noopener">리포트 →</a>
        </div>`).join("")
    : "";

  if (TYPHOON.active && TYPHOON.active.length > 0) {
    const rows = TYPHOON.active.map(t => `
      <div class="typhoon-row">
        <b>${esc(t.name)}</b> (${esc(t.alertLevel)}) · ${esc(t.nearestHub)}까지 약 ${t.distanceKm}km<br>
        ${esc(t.severityText)}
        <a href="${esc(t.reportUrl)}" target="_blank" rel="noopener">GDACS 리포트 →</a>
      </div>`).join("");
    typhoonSection.innerHTML = `
      <div class="typhoon-card alert">
        <div class="headline">⚠ 태풍 활동 중 — 부자재 입고 지연 주의</div>
        ${rows}
        ${pastBlock}
      </div>`;
  } else {
    typhoonSection.innerHTML = `
      <div class="typhoon-card calm">
        <div class="headline">활성 태풍 없음 · 입고 일정 영향 없음</div>
        ${pastBlock}
      </div>`;
  }
}

function priceChartSvg(points) {
  const W = 560, H = 150, PAD_L = 44, PAD_R = 10, PAD_T = 12, PAD_B = 24;
  const vals = points.map(p => p.value);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1;
  const x = i => PAD_L + (i / Math.max(points.length - 1, 1)) * (W - PAD_L - PAD_R);
  const y = v => PAD_T + (1 - (v - lo) / span) * (H - PAD_T - PAD_B);

  const line = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const area = `${line} L${x(points.length - 1).toFixed(1)},${(H - PAD_B).toFixed(1)} L${x(0).toFixed(1)},${(H - PAD_B).toFixed(1)} Z`;

  // 4 horizontal gridlines with value labels
  const grid = [0, 0.33, 0.66, 1].map(f => {
    const v = lo + f * span;
    const yy = y(v);
    return `<line x1="${PAD_L}" y1="${yy.toFixed(1)}" x2="${W - PAD_R}" y2="${yy.toFixed(1)}" class="ch-grid"/>
            <text x="${PAD_L - 6}" y="${(yy + 3.5).toFixed(1)}" class="ch-ylabel">${Math.round(v)}</text>`;
  }).join("");

  // first / middle / last x labels only - a label per month would collide at this width
  const tickIdx = [0, Math.floor((points.length - 1) / 2), points.length - 1];
  const xlabels = tickIdx.map(i =>
    `<text x="${x(i).toFixed(1)}" y="${H - 6}" class="ch-xlabel" text-anchor="${i === 0 ? "start" : i === points.length - 1 ? "end" : "middle"}">${esc(points[i].label)}</text>`
  ).join("");

  const lastX = x(points.length - 1), lastY = y(points[points.length - 1].value);

  return `<svg viewBox="0 0 ${W} ${H}" class="price-chart" role="img" aria-label="가격 추이 차트">
    ${grid}
    <path d="${area}" class="ch-area"/>
    <path d="${line}" class="ch-line"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" class="ch-dot"/>
    ${xlabels}
  </svg>`;
}

const materialsGrid = document.getElementById("materialsGrid");
const materialCards = [];

if (KCL && KCL.points && KCL.points.length > 0) {
  const pts = KCL.points;
  const latest = pts[pts.length - 1];
  const prior = pts.length > 1 ? pts[pts.length - 2] : null;
  const diff = prior ? latest.value - prior.value : 0;
  const up = diff >= 0;
  const changeHtml = prior
    ? `<span class="chg ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(diff).toFixed(1)} (전월비)</span>`
    : "";
  materialCards.push(`
    <div class="card wide">
      <h3>KCl (염화칼륨) 국제가격</h3>
      <div class="price-now">
        <span class="pv">$${latest.value}</span>
        <span class="pu">/${esc((KCL.unit || "").replace("USD/", ""))}</span>
        ${changeHtml}
        <span class="pd">${esc(latest.label)} 기준</span>
      </div>
      ${priceChartSvg(pts)}
      <div class="chart-note">최근 ${pts.length}개월 · ${esc(KCL.source || "")}</div>
    </div>`);
}

if (MATERIALS && MATERIALS.length > 0) {
  MATERIALS.forEach(m => {
    const news = (m.news && m.news.length)
      ? m.news.map(n => `<div class="news-item">· <a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><span class="src">${esc(n.source || "")} · ${esc(n.date)}</span></div>`).join("")
      : `<div class="empty-note">관련 뉴스 없음</div>`;
    materialCards.push(`
      <div class="card">
        <h3>${esc(m.displayName)}</h3>
        <div class="news-caveat">공개 수치 API 없음 — 관련 뉴스</div>
        ${news}
      </div>`);
  });
}

materialsGrid.innerHTML = materialCards.length
  ? materialCards.join("")
  : `<div class="empty-note">원자재 정보를 가져오지 못했습니다.</div>`;
</script>
</body>
</html>
